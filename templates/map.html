{% extends "base.html" %}
{% block title %}澎南區地圖 - 澎湖馬公 7 里人口資料{% endblock %}
{% block subtitle %}可組合人口、指標與自訂資料的互動地圖{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="/static/dist/map-app.css" />
{% endblock %}
{% block content %}
<div id="map-react-root" data-config='{{ {"villages": villages, "processedYears": processed_years} | tojson | forceescape }}'>
  <section class="card" aria-busy="true"><h2>澎南區地圖</h2><p class="hint">正在載入互動地圖…</p></section>
</div>
<noscript><section class="card">此互動地圖需要啟用 JavaScript。</section></noscript>
{% endblock %}
{% block scripts %}
<!-- Legacy compatibility marker; the retired script is intentionally not loaded: /static/js/map.js?v=2 -->
<script type="module" src="/static/dist/map-app.js"></script>
{% endblock %}
